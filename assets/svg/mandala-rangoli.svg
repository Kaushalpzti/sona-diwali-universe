<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="mandalaGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9c4" />
      <stop offset="40%" stop-color="#ffd54f" />
      <stop offset="75%" stop-color="#ff8f00" />
      <stop offset="100%" stop-color="#c43e00" />
    </radialGradient>
    <radialGradient id="mandalaPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff80ab" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#c2185b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4a148c" stop-opacity="0.1" />
    </radialGradient>
    <filter id="rangoliGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(200, 200)" filter="url(#rangoliGlow)">
    <!-- Outer Aura Rings -->
    <circle r="185" fill="none" stroke="#ffd54f" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.5" />
    <circle r="175" fill="none" stroke="#ff80ab" stroke-width="1.2" opacity="0.6" />
    <circle r="160" fill="url(#mandalaPink)" />

    <!-- 16 Outer Lotus Petals -->
    <g stroke="#ffe082" stroke-width="1.5" fill="rgba(255, 213, 79, 0.15)">
      
        <path d="M 0,-130 Q 24,-155 0,-175 Q -24,-155 0,-130 Z" transform="rotate(0)" />
        <circle cx="0" cy="-178" r="2.5" fill="#fff" transform="rotate(0)" />
      
        <path d="M 0,-130 Q 24,-155 0,-175 Q -24,-155 0,-130 Z" transform="rotate(22.5)" />
        <circle cx="0" cy="-178" r="2.5" fill="#fff" transform="rotate(22.5)" />
      
        <path d="M 0,-130 Q 24,-155 0,-175 Q -24,-155 0,-130 Z" transform="rotate(45)" />
        <circle cx="0" cy="-178" r="2.5" fill="#fff" transform="rotate(45)" />
      
        <path d="M 0,-130 Q 24,-155 0,-175 Q -24,-155 0,-130 Z" transform="rotate(67.5)" />
        <circle cx="0" cy="-178" r="2.5" fill="#fff" transform="rotate(67.5)" />
      
        <path d="M 0,-130 Q 24,-155 0,-175 Q -24,-155 0,-130 Z" transform="rotate(90)" />
        <circle cx="0" cy="-178" r="2.5" fill="#fff" transform="rotate(90)" />
      
        <path d="M 0,-130 Q 24,-155 0,-175 Q -24,-155 0,-130 Z" transform="rotate(112.5)" />
        <circle cx="0" cy="-178" r="2.5" fill="#fff" transform="rotate(112.5)" />
      
        <path d="M 0,-130 Q 24,-155 0,-175 Q -24,-155 0,-130 Z" transform="rotate(135)" />
        <circle cx="0" cy="-178" r="2.5" fill="#fff" transform="rotate(135)" />
      
        <path d="M 0,-130 Q 24,-155 0,-175 Q -24,-155 0,-130 Z" transform="rotate(157.5)" />
        <circle cx="0" cy="-178" r="2.5" fill="#fff" transform="rotate(157.5)" />
      
        <path d="M 0,-130 Q 24,-155 0,-175 Q -24,-155 0,-130 Z" transform="rotate(180)" />
        <circle cx="0" cy="-178" r="2.5" fill="#fff" transform="rotate(180)" />
      
        <path d="M 0,-130 Q 24,-155 0,-175 Q -24,-155 0,-130 Z" transform="rotate(202.5)" />
        <circle cx="0" cy="-178" r="2.5" fill="#fff" transform="rotate(202.5)" />
      
        <path d="M 0,-130 Q 24,-155 0,-175 Q -24,-155 0,-130 Z" transform="rotate(225)" />
        <circle cx="0" cy="-178" r="2.5" fill="#fff" transform="rotate(225)" />
      
        <path d="M 0,-130 Q 24,-155 0,-175 Q -24,-155 0,-130 Z" transform="rotate(247.5)" />
        <circle cx="0" cy="-178" r="2.5" fill="#fff" transform="rotate(247.5)" />
      
        <path d="M 0,-130 Q 24,-155 0,-175 Q -24,-155 0,-130 Z" transform="rotate(270)" />
        <circle cx="0" cy="-178" r="2.5" fill="#fff" transform="rotate(270)" />
      
        <path d="M 0,-130 Q 24,-155 0,-175 Q -24,-155 0,-130 Z" transform="rotate(292.5)" />
        <circle cx="0" cy="-178" r="2.5" fill="#fff" transform="rotate(292.5)" />
      
        <path d="M 0,-130 Q 24,-155 0,-175 Q -24,-155 0,-130 Z" transform="rotate(315)" />
        <circle cx="0" cy="-178" r="2.5" fill="#fff" transform="rotate(315)" />
      
        <path d="M 0,-130 Q 24,-155 0,-175 Q -24,-155 0,-130 Z" transform="rotate(337.5)" />
        <circle cx="0" cy="-178" r="2.5" fill="#fff" transform="rotate(337.5)" />
      
    </g>

    <!-- Mid Geometric Ring -->
    <circle r="125" fill="none" stroke="#ffb300" stroke-width="2" />
    <circle r="115" fill="none" stroke="#ff4081" stroke-width="1" stroke-dasharray="3,3" />

    <!-- 8 Inner Ornate Petals -->
    <g fill="url(#mandalaGold)" stroke="#ffe082" stroke-width="1.5">
      
        <path d="M 0,-60 Q 32,-90 0,-120 Q -32,-90 0,-60 Z" transform="rotate(0)" />
        <circle cx="0" cy="-90" r="3.5" fill="#ffffff" transform="rotate(0)" />
      
        <path d="M 0,-60 Q 32,-90 0,-120 Q -32,-90 0,-60 Z" transform="rotate(45)" />
        <circle cx="0" cy="-90" r="3.5" fill="#ffffff" transform="rotate(45)" />
      
        <path d="M 0,-60 Q 32,-90 0,-120 Q -32,-90 0,-60 Z" transform="rotate(90)" />
        <circle cx="0" cy="-90" r="3.5" fill="#ffffff" transform="rotate(90)" />
      
        <path d="M 0,-60 Q 32,-90 0,-120 Q -32,-90 0,-60 Z" transform="rotate(135)" />
        <circle cx="0" cy="-90" r="3.5" fill="#ffffff" transform="rotate(135)" />
      
        <path d="M 0,-60 Q 32,-90 0,-120 Q -32,-90 0,-60 Z" transform="rotate(180)" />
        <circle cx="0" cy="-90" r="3.5" fill="#ffffff" transform="rotate(180)" />
      
        <path d="M 0,-60 Q 32,-90 0,-120 Q -32,-90 0,-60 Z" transform="rotate(225)" />
        <circle cx="0" cy="-90" r="3.5" fill="#ffffff" transform="rotate(225)" />
      
        <path d="M 0,-60 Q 32,-90 0,-120 Q -32,-90 0,-60 Z" transform="rotate(270)" />
        <circle cx="0" cy="-90" r="3.5" fill="#ffffff" transform="rotate(270)" />
      
        <path d="M 0,-60 Q 32,-90 0,-120 Q -32,-90 0,-60 Z" transform="rotate(315)" />
        <circle cx="0" cy="-90" r="3.5" fill="#ffffff" transform="rotate(315)" />
      
    </g>

    <!-- Center Blossom -->
    <circle r="55" fill="rgba(255, 64, 129, 0.4)" stroke="#ffd54f" stroke-width="2" />
    <circle r="42" fill="#ffd54f" />
    
    <!-- 8 Center Mini Petals -->
    <g fill="#fff59d">
      
        <ellipse cx="0" cy="-22" rx="7" ry="14" transform="rotate(0)" />
      
        <ellipse cx="0" cy="-22" rx="7" ry="14" transform="rotate(45)" />
      
        <ellipse cx="0" cy="-22" rx="7" ry="14" transform="rotate(90)" />
      
        <ellipse cx="0" cy="-22" rx="7" ry="14" transform="rotate(135)" />
      
        <ellipse cx="0" cy="-22" rx="7" ry="14" transform="rotate(180)" />
      
        <ellipse cx="0" cy="-22" rx="7" ry="14" transform="rotate(225)" />
      
        <ellipse cx="0" cy="-22" rx="7" ry="14" transform="rotate(270)" />
      
        <ellipse cx="0" cy="-22" rx="7" ry="14" transform="rotate(315)" />
      
    </g>

    <!-- Sacred Golden Core -->
    <circle r="15" fill="#e65100" />
    <circle r="8" fill="#ffffff" />
  </g>
</svg>