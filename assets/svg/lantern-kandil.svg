<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 260" width="100%" height="100%">
  <defs>
    <linearGradient id="kandilBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758f" />
      <stop offset="50%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#d90429" />
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="50%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#ff6f00" />
    </linearGradient>
    <filter id="lanternGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hanging Cord -->
  <line x1="80" y1="0" x2="80" y2="45" stroke="#ffe082" stroke-width="2" stroke-dasharray="2,2" />
  <circle cx="80" cy="45" r="4" fill="#ffb300" />

  <!-- Glow Aura behind Lantern -->
  <circle cx="80" cy="115" r="60" fill="rgba(255, 183, 3, 0.4)" filter="url(#lanternGlow)" />

  <!-- Top Decorative Crown -->
  <polygon points="80,48 105,70 55,70" fill="url(#goldRibbon)" stroke="#ffd54f" stroke-width="1" />
  
  <!-- Central Diamond Lantern Body -->
  <polygon points="80,68 128,115 80,162 32,115" fill="url(#kandilBody)" stroke="#ffe082" stroke-width="2" />

  <!-- Intricate Inner Windows -->
  <polygon points="80,82 114,115 80,148 46,115" fill="rgba(255, 255, 255, 0.25)" stroke="#fff" stroke-width="1.2" />
  <circle cx="80" cy="115" r="14" fill="#fff9c4" opacity="0.9" filter="url(#lanternGlow)" />
  <circle cx="80" cy="115" r="8" fill="#ff5722" />

  <!-- Triangular Facet Cutouts -->
  <polygon points="80,68 80,162 32,115" fill="rgba(0, 0, 0, 0.12)" />
  <polygon points="80,68 128,115 80,115" fill="rgba(255, 255, 255, 0.2)" />

  <!-- Bottom Gold Band -->
  <rect x="52" y="158" width="56" height="8" rx="3" fill="url(#goldRibbon)" stroke="#ffd54f" stroke-width="1" />

  <!-- Flowing Silk Tassels -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round">
    <path d="M 58,166 Q 52,205 56,245" stroke="#ff758f" />
    <path d="M 68,166 Q 64,210 67,255" stroke="#ffd166" />
    <path d="M 80,166 Q 80,215 80,260" stroke="#ffb703" stroke-width="3" />
    <path d="M 92,166 Q 96,210 93,255" stroke="#ffd166" />
    <path d="M 102,166 Q 108,205 104,245" stroke="#ff758f" />
  </g>
  <!-- Tiny Bells at Tassel Ends -->
  <circle cx="56" cy="246" r="3" fill="#ffe082" />
  <circle cx="67" cy="256" r="3.5" fill="#ffe082" />
  <circle cx="80" cy="260" r="4" fill="#ffffff" />
  <circle cx="93" cy="256" r="3.5" fill="#ffe082" />
  <circle cx="104" cy="246" r="3" fill="#ffe082" />
</svg>